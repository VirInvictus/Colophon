[workspace]
members = ["colophon-core", "colophon"]
default-members = ["colophon"]
resolver = "2"

[workspace.package]
version = "2.6.2"
edition = "2024"
# Dependency-driven since v2.6.1: rusqlite 0.41 (for the libsqlite3-sys
# advisory floor) needs 1.89; no source feature above that.
rust-version = "1.89"
license = "MIT"
authors = ["Brandon LaRocque"]

[workspace.dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
anyhow = "1.0"
chrono = "0.4"
# Sandboxed Lua VM for reading KOReader's `.sdr` sidecars (a Lua table
# chunk). Vendored so it builds from source, like rusqlite's bundled sqlite.
mlua = { version = "0.10", features = ["lua54", "vendored"] }
gtk = { version = "0.9", package = "gtk4", features = ["v4_16"] }
# EPUB word counts (the GO'd word-count axis): the only member that
# touches it is colophon-core::wordcount, for reading the container.
# The 2.x line is patched out (six RustSec advisories land in 9.0.5+;
# RUSTSEC-2026-0367/-0368/-0369/-0429/-0459/-0548), so 9 is the floor.
zip = { version = "9", default-features = false, features = ["deflate"] }
