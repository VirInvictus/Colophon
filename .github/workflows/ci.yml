name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    # Colophon requires gtk4 >= 4.16 (v4_16); Ubuntu runners ship 4.14, so
    # the build aborts in gdk4-sys. Fedora carries a new-enough GTK.
    # rusqlite is bundled and mlua vendored, so both compile their C from
    # source and need only a toolchain, not the system -devel packages.
    # Version-pinned on purpose: fedora:latest floats every Fedora release
    # under a GTK-version-sensitive build. Bump the pin deliberately.
    container: fedora:44
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y \
            gcc \
            git \
            pkgconf-pkg-config \
            glib2-devel \
            gtk4-devel \
            xorg-x11-server-Xvfb

      # actions/checkout v5.0.0
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Install Rust toolchain
        # dtolnay/rust-toolchain@stable was a mutable branch; the SHA pins
        # the action's implementation (the toolchain it installs is still
        # whatever `stable` resolves to at run time).
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          components: rustfmt, clippy

      # Swatinem/rust-cache v2.8.0
      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684

      # EmbarkStudios/cargo-deny-action v2 (the cargo-deny authors' own
      # action): RustSec advisories against every locked crate, including
      # the bundled sqlite and vendored lua. Advisories only; see deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902
        with:
          command: check advisories

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        # No current test calls gtk::init(), but the GTK binary crate links
        # gtk4 and a widget test could land later; running under xvfb keeps a
        # display available so the suite never depends on a headful runner.
        env:
          GDK_BACKEND: x11
        run: xvfb-run -a cargo test --workspace
